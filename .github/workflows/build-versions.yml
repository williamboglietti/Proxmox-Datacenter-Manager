name: Build historical PDM versions

# Build reproductible d'anciennes versions PDM avec nos patches conteneur.
# Déclenché manuellement ou par l'auto-update. Chaque version est buildée via
# --build-arg PDM_VERSION, publiée avec son tag exact X.Y.Z et exposée comme
# GitHub Release. Ne touche pas aux alias mobiles `latest` et X.Y, qui restent
# gérés par docker-publish.yml.

on:
  workflow_call:
    inputs:
      versions:
        description: "Versions PDM à builder (séparées par des virgules)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      versions:
        description: "Versions PDM à builder (séparées par des virgules)"
        default: "0.9.0,0.9.1,0.9.2,0.9.3,0.9.4,1.0.0,1.0.1,1.0.2,1.0.3,1.0.4,1.0.5,1.0.6,1.0.7,1.1.1,1.1.3,1.1.4,1.1.5,1.1.6,1.1.7"
        required: true
        type: string

env:
  IMAGE_NAME: proxmox-datacenter-manager

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          set -euo pipefail
          JSON=$(echo "${{ inputs.versions }}" \
            | tr ',' '\n' | sed 's/[[:space:]]//g' | grep -v '^$' \
            | jq -R . | jq -s -c .)
          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
          echo "Versions : $JSON"

  build-push:
    needs: prep
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        version: ${{ fromJSON(needs.prep.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (load locally, no push yet)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: pdm-ci:build
          build-args: |
            PDM_VERSION=${{ matrix.version }}
          cache-from: type=gha,scope=${{ matrix.version }}
          cache-to: type=gha,mode=max,scope=${{ matrix.version }}

      - name: Verify installed PDM version matches the request
        run: |
          set -euo pipefail
          GOT=$(docker run --rm --entrypoint dpkg-query pdm-ci:build \
            -W -f="\${Version}" proxmox-datacenter-manager)
          GOT=${GOT%%[-+]*}
          if [ "$GOT" != "${{ matrix.version }}" ]; then
            echo "::error::Image embarque PDM $GOT, attendu ${{ matrix.version }}."
            exit 1
          fi
          echo "OK : PDM $GOT"

      - name: Installer Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0
          cache: false

      - name: Signaler les vulnérabilités MEDIUM/LOW (amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pdm-ci:build
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          severity: MEDIUM,LOW
          exit-code: '0'
          skip-setup-trivy: true

      - name: Bloquer les vulnérabilités HIGH/CRITICAL (amd64), corrigées ou non
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pdm-ci:build
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'
          skip-setup-trivy: true

      - name: Log in to GHCR after the scan
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub after the scan
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag & push (version exacte uniquement)
        env:
          GHCR: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          DH: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          V: ${{ matrix.version }}
        run: |
          set -euo pipefail
          # Tags X.Y.Z exacts seulement. Les alias mobiles (latest, X.Y) sont la
          # propriété exclusive de docker-publish.yml : aucun chevauchement, donc
          # pas de course entre workflows sur ces tags.
          TAGS="$V"
          echo "Tags poussés pour PDM $V : $TAGS"
          for reg in "$GHCR" "$DH"; do
            for t in $TAGS; do
              docker tag pdm-ci:build "$reg:$t"
              docker push "$reg:$t"
            done
          done

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          DH: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          V: ${{ matrix.version }}
        run: |
          set -euo pipefail
          TAG="v$V"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG déjà présente."
            exit 0
          fi
          NOTES=$(printf 'Image conteneur Proxmox Datacenter Manager %s (amd64).\n\nCommandes de téléchargement :\n- docker pull %s:%s\n- docker pull %s:%s\n' "$V" "$GHCR" "$V" "$DH" "$V")
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "$TAG" --notes "$NOTES" --latest=false
