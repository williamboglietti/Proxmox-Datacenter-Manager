name: Auto-update PDM image

# Hebdomadaire : publie chaque version PDM exacte absente de GHCR, puis remet
# `latest` et l'alias minor sur la dernière version disponible si nécessaire.

on:
  schedule:
    - cron: "0 6 * * 1" # tous les lundis à 06:00 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      missing_versions: ${{ steps.detect.outputs.missing_versions }}
      has_missing_versions: ${{ steps.detect.outputs.has_missing_versions }}
      needs_latest: ${{ steps.detect.outputs.needs_latest }}
      available: ${{ steps.detect.outputs.available }}
      current: ${{ steps.detect.outputs.current }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect missing PDM versions
        id: detect
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/${{ github.repository_owner }}/proxmox-datacenter-manager
          VERSIONS=$(docker run --rm debian:trixie-slim bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends wget ca-certificates >/dev/null
            wget -qO /usr/share/keyrings/proxmox-archive-keyring.gpg \
              https://enterprise.proxmox.com/debian/proxmox-archive-keyring-trixie.gpg
            printf "%s\n" \
              "Types: deb" \
              "URIs: http://download.proxmox.com/debian/pdm" \
              "Suites: trixie" \
              "Components: pdm-no-subscription" \
              "Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg" \
              > /etc/apt/sources.list.d/proxmox.sources
            apt-get update -qq
            apt-cache madison proxmox-datacenter-manager \
              | awk "{print \$3}" | sed "s/[-+].*//" | sort -V -u
          ')
          LATEST=$(printf '%s\n' "$VERSIONS" | tail -1)
          [ -n "$LATEST" ] || { echo "::error::Aucune version PDM trouvée."; exit 1; }

          MISSING=""
          for VERSION in $VERSIONS; do
            if ! docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
              MISSING="${MISSING}${MISSING:+ }$VERSION"
            fi
          done

          HISTORICAL=$(for VERSION in $MISSING; do
            [ "$VERSION" = "$LATEST" ] || printf '%s\n' "$VERSION"
          done | paste -sd, -)
          HAS_HISTORICAL=false
          [ -z "$HISTORICAL" ] || HAS_HISTORICAL=true

          LATEST_MISSING=false
          for VERSION in $MISSING; do
            [ "$VERSION" != "$LATEST" ] || LATEST_MISSING=true
          done

          CURRENT=""
          if docker pull -q "$IMAGE:latest" >/dev/null 2>&1; then
            CURRENT=$(docker run --rm --entrypoint dpkg-query "$IMAGE:latest" \
              -W -f='${Version}' proxmox-datacenter-manager)
            CURRENT=${CURRENT%%[-+]*}
          fi

          NEEDS_LATEST=false
          if [ "$LATEST_MISSING" = true ] || [ "$CURRENT" != "$LATEST" ]; then
            NEEDS_LATEST=true
          fi

          {
            echo "missing_versions=$HISTORICAL"
            echo "has_missing_versions=$HAS_HISTORICAL"
            echo "needs_latest=$NEEDS_LATEST"
            echo "available=$LATEST"
            echo "current=$CURRENT"
          } >> "$GITHUB_OUTPUT"

          if [ "$HAS_HISTORICAL" = true ]; then
            echo "::notice::Versions exactes absentes de GHCR : $HISTORICAL"
          else
            echo "::notice::Toutes les versions PDM historiques sont présentes sur GHCR."
          fi
          if [ "$NEEDS_LATEST" = true ]; then
            echo "::notice::Alias latest à publier : PDM ${CURRENT:-absent} -> $LATEST"
          else
            echo "::notice::Alias latest déjà à jour sur PDM $LATEST."
          fi

  publish-missing:
    needs: check
    if: needs.check.outputs.has_missing_versions == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-versions.yml
    with:
      versions: ${{ needs.check.outputs.missing_versions }}
    secrets: inherit

  publish-latest:
    needs: check
    if: needs.check.outputs.needs_latest == 'true'
    permissions:
      contents: write # Le workflow appelé ne peut pas élever les permissions du caller.
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    secrets: inherit
